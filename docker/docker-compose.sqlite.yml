# Minimal single-container QRCODE using SQLite (no PostgreSQL).
#
#   docker compose -f docker/docker-compose.sqlite.yml up -d   →  http://localhost

services:
  QRCODE:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/Clyvora/QRCODE:latest
    restart: unless-stopped
    environment:
      QRCODE_BASE_URL: ${QRCODE_BASE_URL:-http://localhost}
    volumes:
      - QRCODE-data:/data
    ports:
      - "${QRCODE_PORT:-80}:8080"

volumes:
  QRCODE-data:
